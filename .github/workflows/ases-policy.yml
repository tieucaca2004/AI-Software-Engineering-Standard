name: ASES Policy Integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-integrity:
    name: ASES policy files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate ASES policy files
        run: python scripts/check_policy.py
      - name: Run ASES source preflight
        run: python scripts/ases_preflight.py --project-root .
      - name: Check snapshot manifest is current
        run: python scripts/ases_verify.py manifest --check
      - name: Run governance and UAM tests
        run: python -m unittest discover -s tests -v
